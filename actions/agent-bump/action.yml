name: Atelier agent dependency update
description: >-
  A coding agent updates the repository's dependencies in an Atelier sandbox:
  it reads the release notes, migrates the configuration, replaces what the
  new versions deprecate, runs the checks, and opens one pull request.
author: Frak
branding:
  icon: package
  color: purple

# README.md has the workflow to copy (on a schedule), the setup on Atelier's
# side and how an update goes.
inputs:
  atelier-url:
    description: Base URL of the Atelier server, e.g. https://atelier.example.com.
    required: true
  api-key:
    description: >-
      API key (`mcp` scope) of the Atelier service account the update runs
      as. Pass it from a secret. Its GitHub credential pushes the branch and
      opens the pull request.
    required: true
  mode:
    description: >-
      `bump` (the default), or `cleanup` in a step that runs `if: cancelled()`:
      destroys the sandbox of the cancelled update.
    default: ""
  base:
    description: Branch the update starts from and targets. Empty for the default branch.
    default: ""
  branch:
    description: >-
      Branch that carries the update, force-pushed by each run while it's
      only the job's: a person's commits on it stop the runs until its pull
      request is merged or closed.
    default: agent-bump
  image:
    description: >-
      Base image the sandbox boots on. Atelier reuses the repository's
      prebuild on it, and bakes one if there is none.
    default: dev-base
  minimum-release-age:
    description: >-
      Days a release must have been out before the agent takes it. A
      compromised release is usually caught and pulled within days.
    default: "3"
  subagents:
    description: >-
      `auto` (the default): sub-agents read the release notes when there are
      more than 6 updates. `always` or `never` to choose. They need
      pi-subagents in the sandbox. The agent alone edits and commits.
    default: auto
  subagent-model:
    description: >-
      Model the sub-agents run on, as pi-subagents names it
      (`provider/model`). Empty: their default. The agent's own model comes
      from its toolbox (`toolboxes`).
    default: ""
  toolboxes:
    description: >-
      Toolboxes the sandbox gets on top of its org's auto-included ones, as
      Atelier's `whoami` lists their selectors, comma- or line-separated.
    default: ""
  instructions:
    description: >-
      Text added to the agent's prompt: dependencies to hold or pin,
      ecosystems to leave out, how far to go.
    default: ""
  instructions-file:
    description: >-
      A file of instructions like `instructions`, read on the base branch (the
      update can't change its own). Skipped when missing; empty to read none.
    default: DEPENDENCIES.md
  labels:
    description: Labels for the pull request, comma- or line-separated. They must exist.
    default: ""
  agent-timeout-minutes:
    description: >-
      The agent's time for the update, past which it is cancelled. Give the
      job about 30 minutes more (the sandbox's boot, then the push).
    default: "90"
  bun-version:
    description: Bun version the action runs on.
    default: "1.4.4"

runs:
  using: composite
  steps:
    # Once the job is cancelled (the job's timeout, by hand), skipped and the
    # update in progress stopped, except for `cleanup`, which runs then.
    - if: inputs.mode == 'cleanup' || (!cancelled() && !failure())
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - if: inputs.mode == 'cleanup' || (!cancelled() && !failure())
      shell: bash
      run: bun "$GITHUB_ACTION_PATH/src/main.ts"
      env:
        ATELIER_URL: ${{ inputs.atelier-url }}
        ATELIER_API_KEY: ${{ inputs.api-key }}
        # The job's own token, to read: the service account's credential, in
        # the sandbox, writes.
        GITHUB_TOKEN: ${{ github.token }}
        MODE: ${{ inputs.mode }}
        BASE: ${{ inputs.base }}
        BRANCH: ${{ inputs.branch }}
        IMAGE: ${{ inputs.image }}
        MINIMUM_RELEASE_AGE: ${{ inputs.minimum-release-age }}
        SUBAGENTS: ${{ inputs.subagents }}
        SUBAGENT_MODEL: ${{ inputs.subagent-model }}
        TOOLBOXES: ${{ inputs.toolboxes }}
        INSTRUCTIONS: ${{ inputs.instructions }}
        INSTRUCTIONS_FILE: ${{ inputs.instructions-file }}
        LABELS: ${{ inputs.labels }}
        AGENT_TIMEOUT_MINUTES: ${{ inputs.agent-timeout-minutes }}
