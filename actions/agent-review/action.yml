name: Atelier agent review
description: >-
  A coding agent reviews the pull request in an Atelier sandbox, with
  sub-agents, and its findings are posted as one review.
author: Frak
branding:
  icon: eye
  color: purple

# README.md has the workflow to copy, the setup on Atelier's side and how a
# review goes. Runs on pull_request events only: the PR, its head and its base
# come from the event.
inputs:
  atelier-url:
    description: Base URL of the Atelier server, e.g. https://atelier.example.com.
    required: true
  api-key:
    description: >-
      API key (`mcp` scope) of the Atelier service account the review runs as.
      Pass it from a secret.
    required: true
  mode:
    description: >-
      `review` (the default), or `cleanup` once the PR is closed (the default
      on a `closed` event): destroys its review sandboxes and deletes the
      progress comment. `cleanup-head` goes in a step that runs
      `if: cancelled()`: destroys the sandbox of the cancelled review.
    default: ""
  image:
    description: >-
      Base image the sandbox boots on. Atelier reuses the repository's
      prebuild on it, and bakes one if there is none.
    default: dev-base
  agent-timeout-minutes:
    description: >-
      The agent's time for a review, past which it is cancelled. Give the job
      about 20 minutes more (the sandbox's boot, then the posting).
    default: "40"
  bun-version:
    description: Bun version the action runs on.
    default: "1.4.4"

runs:
  using: composite
  steps:
    # A fork's PR gets no secret, its branch isn't one this repository's
    # sandboxes can boot on, and its code would run with the secrets of the
    # account's org.
    - name: Skip a pull request from a fork
      if: github.event.pull_request.head.repo.full_name != github.repository
      shell: bash
      run: >-
        echo "::notice title=Agent review::Only pull requests from
        ${GITHUB_REPOSITORY}'s own branches are reviewed."

    # Once the job is cancelled (a newer push, the job's timeout), skipped and
    # a review in progress stopped, except for `cleanup-head`, which runs then.
    - if: >-
        (inputs.mode == 'cleanup-head' || (!cancelled() && !failure())) &&
        github.event.pull_request.head.repo.full_name == github.repository
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - if: >-
        (inputs.mode == 'cleanup-head' || (!cancelled() && !failure())) &&
        github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      run: bun "$GITHUB_ACTION_PATH/src/main.ts"
      env:
        ATELIER_URL: ${{ inputs.atelier-url }}
        ATELIER_API_KEY: ${{ inputs.api-key }}
        # The job's own token: reviews are posted as github-actions[bot],
        # whose earlier reviews and progress comment a run reads back.
        GITHUB_TOKEN: ${{ github.token }}
        MODE: ${{ inputs.mode }}
        IMAGE: ${{ inputs.image }}
        AGENT_TIMEOUT_MINUTES: ${{ inputs.agent-timeout-minutes }}
        EVENT_ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
