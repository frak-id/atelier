name: Atelier agent review
description: >-
  Coding agents review the pull request in an Atelier sandbox, one for issues
  and one for improvements, with sub-agents, and their findings are posted as
  one review.
author: KONFeature
branding:
  icon: eye
  color: purple

# README.md has the workflow to copy, the setup on Atelier's side and how a
# review goes. Runs on pull_request events only: the PR, its head and its base
# come from the event.
inputs:
  atelier-url:
    description: Base URL of the Atelier server, e.g. https://atelier.example.com.
    required: true
  api-key:
    description: >-
      API key (`mcp` scope) of the Atelier service account the review runs as.
      Pass it from a secret.
    required: true
  mode:
    description: >-
      `review` (the default), or `cleanup` once the PR is closed (the default
      on a `closed` event): destroys its review sandboxes and deletes the
      progress comment. `cleanup-head` goes in a step that runs
      `if: cancelled()`: destroys the sandbox of the cancelled review.
    default: ""
  image:
    description: >-
      Base image the sandbox boots on. Atelier reuses the repository's
      prebuild on it, and bakes one if there is none.
    default: dev-base
  subagents:
    description: >-
      `auto` (the default): each agent reviews a diff of at most 500 changed
      lines (lockfiles aside) alone; on a bigger one, sub-agents are suggested
      and the agent decides whether to use them. `always` suggests them on
      every diff, `never` rules them out. Sub-agents need pi-subagents in the
      sandbox.
    default: auto
  allowed-findings:
    description: >-
      How many new findings of each kind that never blocks a review reports,
      for a diff of up to 600 changed lines: `kind: number`, one per line or
      comma-separated. Kinds: `minor` (5), and the improvements' categories
      `performance`, `duplication`, `conventions` (3 each). A bigger diff
      gets more, by the square root of its size. 0 turns a kind off; with
      every category at 0, no agent looks for improvements.
    default: ""
  reviewer-model:
    description: >-
      Model the sub-agents run on, as pi-subagents names it
      (`provider/model`). Empty: their default. The agent's own model comes
      from its toolbox (`toolboxes`).
    default: ""
  toolboxes:
    description: >-
      Toolboxes the sandbox gets on top of its org's auto-included ones, as
      Atelier's `whoami` lists their selectors, comma- or line-separated. One
      can set the agent's model.
    default: ""
  instructions:
    description: >-
      Text added to the agent's prompt: what to focus on or leave out, how to
      write. It can't change the review's format or rules.
    default: ""
  instructions-file:
    description: >-
      A file of instructions like `instructions`, read on the PR's target
      branch (a PR can't change its own). Skipped when missing; empty to read
      none.
    default: REVIEW.md
  parallel:
    description: >-
      `true` (the default): the two agents run at the same time, each with
      the whole `agent-timeout-minutes`, when the sandbox's pi-acp keeps
      several sessions (`@konfeature/pi-acp`, which the console's pi toolbox
      installs); with upstream pi-acp, one after the other anyway. `false`:
      one after the other, the improvements' agent told what the issues' one
      reported.
    default: "true"
  agent-timeout-minutes:
    description: >-
      The agents' time for a review, past which they are cancelled: each
      has all of it when they run at the same time (`parallel`), else both
      together (the issues' agent up to 70% of it). Give the job about 20
      minutes more (the sandbox's boot, then the posting).
    default: "40"
  bun-version:
    description: Bun version the action runs on.
    default: "1.4.4"

runs:
  using: composite
  steps:
    # A fork's PR gets no secret, its branch isn't one this repository's
    # sandboxes can boot on, and its code would run with the secrets of the
    # account's org.
    - name: Skip a pull request from a fork
      if: github.event.pull_request.head.repo.full_name != github.repository
      shell: bash
      run: >-
        echo "::notice title=Agent review::Only pull requests from
        ${GITHUB_REPOSITORY}'s own branches are reviewed."

    # Once the job is cancelled (a newer push, the job's timeout), skipped and
    # a review in progress stopped, except for `cleanup-head`, which runs then.
    - if: >-
        (inputs.mode == 'cleanup-head' || (!cancelled() && !failure())) &&
        github.event.pull_request.head.repo.full_name == github.repository
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - if: >-
        (inputs.mode == 'cleanup-head' || (!cancelled() && !failure())) &&
        github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      run: bun "$GITHUB_ACTION_PATH/src/main.ts"
      env:
        ATELIER_URL: ${{ inputs.atelier-url }}
        ATELIER_API_KEY: ${{ inputs.api-key }}
        # The job's own token: reviews are posted as github-actions[bot],
        # whose earlier reviews and progress comment a run reads back.
        GITHUB_TOKEN: ${{ github.token }}
        MODE: ${{ inputs.mode }}
        IMAGE: ${{ inputs.image }}
        AGENT_TIMEOUT_MINUTES: ${{ inputs.agent-timeout-minutes }}
        PARALLEL: ${{ inputs.parallel }}
        SUBAGENTS: ${{ inputs.subagents }}
        ALLOWED_FINDINGS: ${{ inputs.allowed-findings }}
        REVIEWER_MODEL: ${{ inputs.reviewer-model }}
        TOOLBOXES: ${{ inputs.toolboxes }}
        INSTRUCTIONS: ${{ inputs.instructions }}
        INSTRUCTIONS_FILE: ${{ inputs.instructions-file }}
        EVENT_ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
