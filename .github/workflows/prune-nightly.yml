name: Prune nightly images

on:
  schedule:
    - cron: "0 4 * * *" # Daily at 4 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what would be deleted and what is protected
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - atelier-server
          - atelier-console
          - sandbox-agent
          - atelier-dev-base
          - atelier-dev-browser
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Prune old nightly versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          # Scheduled runs have no inputs and are never dry.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: .github/scripts/prune-ghcr-package.sh
