# Shared binaries volume for v2 sandboxes. Every sandbox pod mounts this PVC
# read-only at /opt/shared (runtime/kube/kube.resources.ts), so it must be
# pre-populated with opencode + code-server. Mirrors v1's shared-binaries
# PVC + populate Job (charts/atelier/templates/shared-binaries-*), pinned to
# the versions currently live in v1 (code-server 4.123.0, opencode 1.17.4).
# The v2 `catalogAdd` API can add further artifacts later.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-binaries
  namespace: atelier-v2-sandboxes
  labels:
    app.kubernetes.io/name: atelier-v2
    atelier.dev/component: shared-binaries
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 3Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: shared-binaries-populate
  namespace: atelier-v2-sandboxes
  labels:
    app.kubernetes.io/name: atelier-v2
    atelier.dev/component: shared-binaries
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        atelier.dev/component: shared-binaries
    spec:
      securityContext:
        runAsUser: 0
      restartPolicy: Never
      containers:
        - name: updater
          image: curlimages/curl:8.11.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              OC_VERSION=1.17.4
              CS_VERSION=4.123.0
              FINGERPRINT="v2:code-server@${CS_VERSION},opencode@${OC_VERSION}"
              MARKER="/shared/.version"

              if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$FINGERPRINT" ]; then
                echo "[shared-binaries] Already up to date ($FINGERPRINT)"
                exit 0
              fi

              echo "[shared-binaries] Installing opencode v${OC_VERSION}"
              mkdir -p /shared/opencode
              cd /tmp
              curl -fsSL -o archive-opencode \
                "https://github.com/anomalyco/opencode/releases/download/v${OC_VERSION}/opencode-linux-x64-baseline.tar.gz"
              tar -xzf archive-opencode -C /shared/opencode
              rm -f archive-opencode

              echo "[shared-binaries] Installing code-server v${CS_VERSION}"
              mkdir -p /shared/code-server
              cd /tmp
              curl -fsSL -o archive-code-server \
                "https://github.com/coder/code-server/releases/download/v${CS_VERSION}/code-server-${CS_VERSION}-linux-amd64.tar.gz"
              tar -xzf archive-code-server -C /shared/code-server --strip-components=1
              rm -f archive-code-server

              mkdir -p /shared/bin
              [ -f "/shared/opencode/opencode" ] && ln -sf ../opencode/opencode /shared/bin/opencode
              [ -f "/shared/code-server/bin/code-server" ] && ln -sf ../code-server/bin/code-server /shared/bin/code-server

              echo "$FINGERPRINT" > "$MARKER"
              echo "[shared-binaries] Done"
          volumeMounts:
            - name: shared-binaries
              mountPath: /shared
      volumes:
        - name: shared-binaries
          persistentVolumeClaim:
            claimName: shared-binaries
