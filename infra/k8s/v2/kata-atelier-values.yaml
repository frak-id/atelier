# kata-deploy Helm values for Atelier v2 (staging: hetzner-atelier, k3s).
#
# Adds a `kata-atelier-clh` runtime = stock `clh` + a Kata config.d drop-in that
# enables virtiofsd `--xattr`. v2 sandboxes assemble `/home/dev` as a native
# kernel overlay whose upperdir is on the virtio-fs PVC; overlayfs needs to
# persist metadata as xattrs on the upper, the guest mounts the overlay with
# `userxattr` (agent, toolset.rs), and virtio-fs only forwards `user.*` when
# virtiofsd runs with `--xattr`. Baking it into a chart-managed custom runtime
# makes it durable across kata-deploy rolls (which otherwise reset /opt/kata to
# bundled defaults). Matched pair with the agent's `userxattr` mount option —
# remove both together.
#
# The server targets this class via `infra/k8s/v2/30-config.yaml` runtimeClass
# (env ATELIER_K8S_RUNTIME_CLASS=kata-atelier-clh).
#
# Apply:
#   helm upgrade kata-deploy \
#     oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy \
#     --version 3.31.0 -n default -f infra/k8s/v2/kata-atelier-values.yaml

# --- preserved from the existing release ---
k8sDistribution: k3s
env:
  createDefaultRuntimeClass: true
  createRuntimeClasses: true

# --- Atelier: virtiofsd --xattr for the overlay-home ---
customRuntimes:
  enabled: true
  runtimes:
    atelier-clh:
      baseConfig: "clh" # inherit stock clh (virtio-fs, cache mode, kernel, ...)
      dropIn: |
        [hypervisor.clh]
        # Kata config.d drop-ins REPLACE arrays (no append), so restate the
        # stock args and add --xattr.
        virtio_fs_extra_args = ["--thread-pool-size=1", "--announce-submounts", "--xattr"]
      runtimeClass: |
        kind: RuntimeClass
        apiVersion: node.k8s.io/v1
        metadata:
          name: kata-atelier-clh
          labels:
            app.kubernetes.io/managed-by: kata-deploy
        handler: kata-atelier-clh
