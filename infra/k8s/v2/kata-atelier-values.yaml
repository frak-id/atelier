# kata-deploy Helm values for Atelier v2 (staging: hetzner-atelier, k3s).
#
# Adds a `kata-atelier-clh` runtime = stock `clh` + a Kata config.d drop-in that
# pins virtio-blk for block-mode volumes. v2 sandboxes attach the workspace PVC
# as a RAW BLOCK device (`volumeMode: Block`); Kata passes it through to the CLH
# guest as virtio-blk, and the guest formats/mounts a native ext4 at /data
# (sandbox-boot.sh). overlayfs then gets real `trusted.overlay.*` xattrs — no
# virtio-fs, no `userxattr`, no `--xattr` (Option C,
# docs/plans/toolset-inplace-update-fix-options.md §3). This replaces the old
# virtiofsd `--xattr` + agent `userxattr` matched pair, which is now deleted.
# Baking the config into a chart-managed custom runtime makes it durable across
# kata-deploy rolls (which otherwise reset /opt/kata to bundled defaults).
#
# The server targets this class via `infra/k8s/v2/30-config.yaml` runtimeClass
# (env ATELIER_K8S_RUNTIME_CLASS=kata-atelier-clh).
#
# Apply:
#   helm upgrade kata-deploy \
#     oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy \
#     --version 3.31.0 -n default -f infra/k8s/v2/kata-atelier-values.yaml

# --- preserved from the existing release ---
k8sDistribution: k3s
env:
  createDefaultRuntimeClass: true
  createRuntimeClasses: true

# --- Atelier: virtio-blk passthrough for the block workspace PVC ---
customRuntimes:
  enabled: true
  runtimes:
    atelier-clh:
      baseConfig: "clh" # inherit stock clh (virtio-fs, cache mode, kernel, ...)
      dropIn: |
        [hypervisor.clh]
        # The workspace PVC is a block volume; pin the virtio-blk driver Kata
        # uses to hotplug it into the guest. This is the stock clh default
        # (stock configuration-clh.toml already sets "virtio-blk"), stated
        # explicitly so a future stock-default change can't silently break the
        # block-device passthrough this runtime depends on. The Go `clh`
        # runtime accepts ONLY "virtio-blk" here (not the runtime-rs
        # "virtio-blk-pci" spelling, and no virtio-scsi) — it errors otherwise.
        block_device_driver = "virtio-blk"
        # Stock virtio-fs args, restated (config.d REPLACES arrays). virtio-fs
        # now only backs Kata's own container-rootfs share, not /data, so the
        # atelier `--xattr` addition is gone.
        virtio_fs_extra_args = ["--thread-pool-size=1", "--announce-submounts"]
      runtimeClass: |
        kind: RuntimeClass
        apiVersion: node.k8s.io/v1
        metadata:
          name: kata-atelier-clh
          labels:
            app.kubernetes.io/managed-by: kata-deploy
        handler: kata-atelier-clh
