# v2 server + console as a single 2-container pod (same origin → the
# sandbox_token cookie + WS/SSE work with no CORS). Images pulled from the
# in-cluster Zot registry (insecure, no auth) built via BuildKit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atelier-v2
  namespace: atelier-v2-system
  labels:
    app.kubernetes.io/name: atelier-v2
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: atelier-v2
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atelier-v2
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: atelier-v2
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: console
          image: zot.zot.svc:5000/atelier-console:v2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: server
          image: zot.zot.svc:5000/atelier-server:v2
          imagePullPolicy: Always
          command: ["bun", "server.js"]
          ports:
            - name: api
              containerPort: 4000
          env:
            - name: ATELIER_SERVER_MODE
              value: production
            - name: ATELIER_CONFIG
              value: /etc/atelier/sandbox.config.json
            - name: DATA_DIR
              value: /app/data
            - name: MIGRATIONS_DIR
              value: /app/drizzle
            - name: ATELIER_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: atelier-v2-secrets
                  key: ATELIER_GITHUB_CLIENT_ID
            - name: ATELIER_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atelier-v2-secrets
                  key: ATELIER_GITHUB_CLIENT_SECRET
            - name: ATELIER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atelier-v2-secrets
                  key: ATELIER_JWT_SECRET
            - name: SANDBOX_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: atelier-v2-secrets
                  key: SANDBOX_SECRETS_KEY
            - name: ATELIER_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: atelier-v2-secrets
                  key: ATELIER_MCP_TOKEN
            # CLIProxy model provider for the opencode harness. URL is public;
            # the API key is server-held and baked into each sandbox's
            # opencode.json at spec enrichment (never exposed to the browser).
            - name: ATELIER_CLIPROXY_URL
              value: https://cliproxy.nivelais.com/v1
            - name: ATELIER_CLIPROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atelier-v2-secrets
                  key: ATELIER_CLIPROXY_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /etc/atelier/sandbox.config.json
              subPath: sandbox.config.json
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: atelier-v2-data
        - name: config
          configMap:
            name: atelier-v2-config
