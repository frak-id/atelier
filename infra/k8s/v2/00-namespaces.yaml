# Atelier v2 — parallel-to-v1 staging deploy on hetzner-atelier.
# System components (server + console) and a dedicated sandbox namespace,
# fully isolated from the live v1 stack (atelier-system / atelier-sandboxes).
apiVersion: v1
kind: Namespace
metadata:
  name: atelier-v2-system
  labels:
    app.kubernetes.io/name: atelier-v2
    app.kubernetes.io/part-of: atelier-v2
---
apiVersion: v1
kind: Namespace
metadata:
  name: atelier-v2-sandboxes
  labels:
    app.kubernetes.io/name: atelier-v2
    app.kubernetes.io/part-of: atelier-v2
    atelier.dev/type: sandbox
