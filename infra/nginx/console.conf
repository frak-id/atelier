# --------------------------------------------------------------------------
# Atelier v2 Console — nginx reverse proxy + SPA serving
#
# Sidecar in the same K8s pod as the v2 server. Serves the console static
# files directly and proxies the server-owned paths to the Elysia server on
# localhost:4000 (same origin, so the httpOnly sandbox_token cookie rides
# every request/upgrade — matches the console's same-origin assumption).
#
# Port: 8080 (unprivileged)
# --------------------------------------------------------------------------

# WebSocket upgrade support: forward "upgrade" when the client sends an
# Upgrade header (terminal + attach WS), otherwise keep the connection header
# empty for SSE (agent events) / plain REST.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ── Hashed Vite assets (immutable, long cache) ────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Server-owned paths → v2 server on localhost:4000 ──────────────────
    #
    # Mirrors the console vite dev proxy: /v1 /api /sessions /auth /health
    # /mcp (+ /swagger). SSE (/sessions/.../events) and WS (terminal, attach)
    # need buffering off + long read timeouts; harmless for plain REST, so a
    # single unified block covers everything.
    location ~ ^/(v1|api|sessions|auth|health|mcp|swagger)(/|$) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }
}
