# --------------------------------------------------------------------------
# Atelier Console — nginx reverse proxy + SPA serving
#
# Sidecar in the same K8s pod as the server. Serves the console static
# files directly and proxies the server-owned paths to the Elysia server on
# localhost:4000 (same origin, so the httpOnly sandbox_token cookie rides
# every request/upgrade — matches the console's same-origin assumption).
#
# Port: 8080 (unprivileged)
# --------------------------------------------------------------------------

# WebSocket upgrade support: forward "upgrade" when the client sends an
# Upgrade header (terminal + attach WS), otherwise keep the connection header
# empty for SSE (agent events) / plain REST.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ── Hashed Vite assets (immutable, long cache) ────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── index.html: always revalidate ─────────────────────────────────────
    #
    # It names the hashed assets of one build; a cached copy would point at
    # assets a redeploy has deleted. Also what the SPA fallback below and
    # `index` resolve to (internal redirects land in this location).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ── Ingress-only auth checks: never public ────────────────────────────
    #
    # `/auth/forward` and `/auth/wake` answer Traefik's forwardAuth
    # middlewares (infra/k8s/80-forward-auth.yaml), which call the server's
    # Service port directly, not this nginx. The public console must not
    # expose them: a client could pick the host they inspect (a paused-state
    # oracle, a way to resume someone's sandbox). Regex locations match in
    # order, so this sits before the proxy block below.
    location ~ ^/auth/(forward|wake)(/|$) {
        return 404;
    }

    # ── Server-owned paths → server on localhost:4000 ─────────────────────
    #
    # KEEP IN SYNC with PROXY_PATHS in apps/console/vite.config.ts (the dev
    # proxy): /v1 /api /sessions /auth /health /mcp (+ /swagger here). SSE (/sessions/.../events) and WS (terminal, attach)
    # need buffering off + long read timeouts; harmless for plain REST, so a
    # single unified block covers everything.
    location ~ ^/(v1|api|sessions|auth|health|mcp|swagger)(/|$) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }
}
