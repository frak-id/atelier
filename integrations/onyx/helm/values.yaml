# Onyx Helm values for Atelier's company-knowledge deployment.
#
# Pinned chart version (deploy.sh --version): 0.8.38
#   https://onyx-dot-app.github.io/onyx/index.yaml, checked 2026-09-28
# Pinned image tag (global.version below): v4.8.1
#   latest non-beta https://github.com/onyx-dot-app/onyx/releases, checked
#   2026-09-28. Keep these two in lockstep on every upgrade — see README
#   "Upgrades".
#
# Base reference: `helm show values onyx/onyx --version 0.8.38`. Only keys
# that differ from the chart default are set here; everything else (Postgres,
# Redis, MinIO topology, worker counts, probes, ...) is left at chart default.
#
# Secrets referenced via `existingSecret` below are created by deploy.sh from
# env vars — never inline here, never in git.

global:
  version: "v4.8.1"
  pullPolicy: "IfNotPresent"

# ---------------------------------------------------------------------------
# Ingress / TLS
#
# DEVIATION from a literal `ingress.enabled: true`: the chart's own
# ingress-{api,webserver,mcp}.yaml templates hardcode
# `nginx.ingress.kubernetes.io/rewrite-target` (an nginx-only annotation,
# ignored by Traefik — the /api path prefix would never be stripped before
# reaching the backend) and a `cert-manager.io/cluster-issuer` annotation
# pinned to a chart-computed name (`<release>-letsencrypt`) whose matching
# ClusterIssuer (rendered by `letsencrypt.enabled: true`) hardcodes an
# nginx-only HTTP-01 solver class with no values override. Neither works on
# this Traefik-only k3s cluster. So: `ingress.enabled: false` and
# `nginx.enabled: false` here, and we render our own Ingress + Middleware
# objects via `extraManifests` below, using the same
# `cert-manager.io/cluster-issuer: letsencrypt-frak` + `ingressClassName:
# traefik` + HTTP-01-via-*.hetzner-staging.frak.id pattern as
# infra/k8s/v2/70-ingress.yaml, plus a Traefik `stripPrefix` Middleware for
# `/api` (the chart's nginx rewrite-target equivalent).
ingress:
  enabled: false

nginx:
  enabled: false

letsencrypt:
  enabled: false

configMap:
  WEB_DOMAIN: "https://onyx.hetzner-staging.frak.id"
  DOMAIN: "onyx.hetzner-staging.frak.id"
  AUTH_TYPE: "basic"
  DISABLE_TELEMETRY: "true"
  # DOCUMENT_ENCODER_MODEL left empty -> default nomic-embed-text-v1.5 (CPU).
  # See README "Known limitations" for the CPU-embedding-throughput issue.

# Onyx MCP server (search_indexed_documents, open_urls) for coding agents in
# Atelier sandboxes / Open-Inspect sessions. Auth is a Bearer Onyx API key/PAT
# per client — see README "Onyx MCP for sandboxes".
mcpServer:
  enabled: true

# The Slack CHAT bot (live @-mention replies) is a different feature from the
# Slack indexing connector (terraform/slack.tf) — leave the bot off. Enable it
# later by setting `slackbot.enabled: true` and configuring bot tokens via
# `POST /manage/admin/slack-app/bots` (see the Onyx API brief) if Atelier
# wants live Slack Q&A in addition to search/agents.
slackbot:
  enabled: false

# Craft (Python code-execution sandbox) is unrelated to Atelier's own
# Launchpad sandboxes and not part of this deployment's scope.
codeInterpreter:
  enabled: false

# ---------------------------------------------------------------------------
# Resource trimming for a small company (~1-20 users). Chart defaults sum to
# ~6-8 CPU / ~16-20Gi requests across api+webserver+model-servers+OpenSearch+
# all celery workers — arithmetic over the chart's own per-component defaults
# in values.yaml:
# https://github.com/onyx-dot-app/onyx/blob/main/deployment/helm/charts/onyx/values.yaml
# (see docs/research/company-knowledge-tools.md for the full "small company"
# sizing rationale). The values below trim OpenSearch and persistence to
# match that sizing. Everything else (celery worker requests/limits,
# Postgres/Redis/MinIO topology) is left at chart default.

opensearch:
  resources:
    requests: { cpu: 1000m, memory: 2Gi }
    limits: { cpu: 2000m, memory: 4Gi }
  # Heap = 50% of the memory *limit* above (chart's own sizing rule).
  opensearchJavaOpts: "-Xmx2g -Xms2g"
  persistence:
    size: 30Gi

postgresql:
  cluster:
    storage:
      size: 20Gi

minio:
  persistence:
    size: 20Gi

inferenceCapability:
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: 2000m, memory: 6Gi }

indexCapability:
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: 2000m, memory: 4Gi }

# ---------------------------------------------------------------------------
# Secrets: point every chart-managed secret at a pre-created Secret (created
# by deploy.sh from env vars, never committed). Names below match the
# chart's own defaults exactly (auth.<x>.secretName / minio.existingSecret /
# opensearch.extraEnvs secretKeyRef), so no other values need to change.
auth:
  postgresql:
    existingSecret: "onyx-postgresql"
  redis:
    existingSecret: "onyx-redis"
  objectstorage:
    existingSecret: "onyx-objectstorage"
  opensearch:
    existingSecret: "onyx-opensearch"
  userauth:
    enabled: true
    existingSecret: "onyx-userauth"

# ---------------------------------------------------------------------------
# Our own Ingress + Traefik Middleware (see the DEVIATION note above).
# Host: onyx.hetzner-staging.frak.id. One shared TLS secret for all three
# paths (same host -> cert-manager issues once). Requires the `traefik.io`
# Middleware CRD group (already used by charts/atelier/templates/
# traefik-middlewares.yaml on this cluster) — if this cluster's Traefik only
# has the older `middleware.crd.traefik.io` CRDs, change apiVersion below to
# match (`kubectl get crd | grep -i traefik` to check).
extraManifests:
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: onyx-api-stripprefix
      namespace: {{ .Release.Namespace }}
    spec:
      stripPrefix:
        prefixes:
          - /api
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: onyx-mcp-stripprefix
      namespace: {{ .Release.Namespace }}
    spec:
      stripPrefix:
        prefixes:
          - /mcp
  - |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: onyx-webserver
      namespace: {{ .Release.Namespace }}
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-frak
        kubernetes.io/tls-acme: "true"
    spec:
      ingressClassName: traefik
      rules:
        - host: onyx.hetzner-staging.frak.id
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: {{ include "onyx.resourceName" (list . "webserver") }}
                    port:
                      number: {{ .Values.webserver.service.servicePort }}
      tls:
        - hosts:
            - onyx.hetzner-staging.frak.id
          secretName: onyx-tls
  - |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: onyx-api
      namespace: {{ .Release.Namespace }}
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-frak
        kubernetes.io/tls-acme: "true"
        traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-onyx-api-stripprefix@kubernetescrd
    spec:
      ingressClassName: traefik
      rules:
        - host: onyx.hetzner-staging.frak.id
          http:
            paths:
              - path: /api
                pathType: Prefix
                backend:
                  service:
                    name: {{ include "onyx.resourceName" (list . "api-service") }}
                    port:
                      number: {{ .Values.api.service.servicePort }}
      tls:
        - hosts:
            - onyx.hetzner-staging.frak.id
          secretName: onyx-tls
  - |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: onyx-mcp
      namespace: {{ .Release.Namespace }}
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-frak
        kubernetes.io/tls-acme: "true"
        traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-onyx-mcp-stripprefix@kubernetescrd
    spec:
      ingressClassName: traefik
      rules:
        - host: onyx.hetzner-staging.frak.id
          http:
            paths:
              - path: /mcp
                pathType: Prefix
                backend:
                  service:
                    name: {{ include "onyx.resourceName" (list . "mcp-server-service") }}
                    port:
                      number: {{ .Values.mcpServer.service.servicePort }}
      tls:
        - hosts:
            - onyx.hetzner-staging.frak.id
          secretName: onyx-tls
